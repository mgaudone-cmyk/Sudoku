<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Sudoku" />
  <meta name="theme-color" content="#f8fafc" />
  <title>Sudoku</title>

  <style>
    :root {
      --bg:#f8fafc;
      --panel:#ffffff;
      --ink:#0f172a;
      --muted:#64748b;
      --line:#cbd5e1;
      --heavy:#0f172a;
      --blue:#2563eb;
      --blue2:#dbeafe;
      --same:#fef08a;
      --same-ring:#facc15;
      --peer:#f1f5f9;
      --fixed:#e5e7eb;
      --bad:#fee2e2;
      --good:#dcfce7;
      --danger:#b91c1c;
      --danger-bg:#fff7f7;
    }

    * {
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    html, body {
      margin:0;
      width:100%;
      height:100%;
      min-height:100%;
      overflow:hidden;
      font-family:Arial, Helvetica, sans-serif;
      background:var(--bg);
      color:var(--ink);
      -webkit-text-size-adjust:100%;
      touch-action:manipulation;
    }

    body {
      padding:
        max(4px, env(safe-area-inset-top))
        max(4px, env(safe-area-inset-right))
        max(4px, env(safe-area-inset-bottom))
        max(4px, env(safe-area-inset-left));
    }

    .app {
      width:100%;
      height:100%;
      max-width:1180px;
      margin:0 auto;
      display:grid;
      grid-template-rows:auto minmax(0,1fr);
      gap:5px;
      background:var(--panel);
      border-radius:18px;
      overflow:hidden;
      padding:6px;
    }

    .topbar {
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:5px;
      min-height:32px;
      flex-shrink:0;
    }

    .stat {
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:32px;
      border:1px solid #e2e8f0;
      border-radius:999px;
      background:#f8fafc;
      color:var(--muted);
      font-size:12px;
      white-space:nowrap;
      overflow:hidden;
    }

    .stat strong {
      color:var(--ink);
      margin-left:4px;
    }

    .game {
      min-height:0;
      display:grid;
      grid-template-rows:minmax(0,1fr) auto;
      gap:5px;
      overflow:hidden;
    }

    .board-zone {
      min-height:0;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      gap:5px;
      overflow:hidden;
    }

    .game-area {
      width:var(--board-size, min(100%, 520px));
      height:var(--board-size, auto);
      max-width:100%;
      max-height:100%;
      position:relative;
      flex:0 0 auto;
    }

    .board {
      width:100%;
      height:100%;
      aspect-ratio:1/1;
      display:grid;
      grid-template-columns:repeat(9,1fr);
      grid-template-rows:repeat(9,1fr);
      border:2.5px solid var(--heavy);
      background:var(--heavy);
      user-select:none;
    }

    .cell {
      background:#fff;
      border:1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:clamp(18px, 6.6vw, 34px);
      font-weight:800;
      color:var(--blue);
      cursor:pointer;
      position:relative;
      touch-action:manipulation;
    }

    .cell.fixed {
      background:var(--fixed);
      color:var(--ink);
      cursor:default;
    }

    .cell.peer { background:var(--peer); }

    .cell.same {
      background:var(--same);
      box-shadow:inset 0 0 0 3px var(--same-ring);
      z-index:1;
    }

    .cell.selected {
      background:var(--blue2);
      outline:2.5px solid var(--blue);
      z-index:3;
    }

    .cell.error {
      background:var(--bad);
      color:#dc2626;
    }

    .cell.conflict {
      background:#ffe4e6;
      color:#be123c;
      box-shadow:inset 0 0 0 3px #fb7185;
      z-index:2;
    }

    .cell.correct:not(.fixed) {
      color:#15803d;
    }

    .cell:nth-child(3n) {
      border-right:2.5px solid var(--heavy);
    }

    .cell:nth-child(9n) {
      border-right:0;
    }

    .cell:nth-child(n+19):nth-child(-n+27),
    .cell:nth-child(n+46):nth-child(-n+54) {
      border-bottom:2.5px solid var(--heavy);
    }

    .notes {
      width:100%;
      height:100%;
      display:grid;
      grid-template-columns:repeat(3,1fr);
      grid-template-rows:repeat(3,1fr);
      align-items:center;
      justify-items:center;
      padding:2px;
      font-size:clamp(12px, 3vw, 18px);
      color:#334155;
      font-weight:800;
    }

    .message {
      width:100%;
      max-width:520px;
      min-height:28px;
      padding:6px 8px;
      border-radius:12px;
      background:#f8fafc;
      color:var(--muted);
      font-size:12px;
      line-height:1.25;
      text-align:center;
      flex-shrink:0;
    }

    .message.win {
      background:var(--good);
      color:#166534;
      font-weight:800;
    }

    .controls {
      display:grid;
      grid-template-rows:auto auto auto;
      gap:5px;
      flex-shrink:0;
    }

    .game-row,
    .action-row {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:5px;
    }

    .numbers {
      display:grid;
      grid-template-columns:repeat(9,1fr);
      gap:3px;
    }

    button, select {
      min-height:38px;
      border:1px solid #d1d5db;
      border-radius:11px;
      background:#fff;
      color:var(--ink);
      font-size:14px;
      font-weight:800;
      padding:6px 5px;
      -webkit-appearance:none;
      appearance:none;
      touch-action:manipulation;
    }

    button:active {
      transform:translateY(1px);
    }

    .num {
      min-height:38px;
      font-size:18px;
      border-radius:10px;
    }

    .primary {
      background:var(--blue);
      color:#fff;
      border-color:var(--blue);
    }

    .danger {
      color:var(--danger);
      background:var(--danger-bg);
      border-color:#fecaca;
    }

    .toggle.active {
      background:var(--blue2);
      border-color:var(--blue);
      color:var(--blue);
    }


    .help-button {
      position:fixed;
      right:max(10px, env(safe-area-inset-right));
      top:max(10px, env(safe-area-inset-top));
      z-index:40;
      width:38px;
      height:38px;
      min-height:38px;
      border-radius:999px;
      border:1px solid #cbd5e1;
      background:#ffffff;
      color:var(--ink);
      box-shadow:0 8px 24px rgba(15,23,42,.14);
      font-size:20px;
      font-weight:900;
      padding:0;
    }

    .onboarding-overlay {
      position:fixed;
      inset:0;
      z-index:80;
      display:flex;
      align-items:center;
      justify-content:center;
      background:rgba(15,23,42,.58);
      backdrop-filter:blur(7px);
      padding:18px;
    }

    .onboarding-overlay.hidden {
      display:none;
    }

    .onboarding-card {
      width:min(430px, 94vw);
      max-height:82dvh;
      overflow:auto;
      background:#ffffff;
      border-radius:24px;
      box-shadow:0 24px 70px rgba(15,23,42,.35);
      padding:20px;
    }

    .onboarding-top {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:10px;
    }

    .onboarding-label {
      color:var(--muted);
      font-size:13px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.05em;
    }

    .onboarding-close {
      width:34px;
      height:34px;
      min-height:34px;
      border-radius:999px;
      padding:0;
      font-size:18px;
      line-height:1;
    }

    .onboarding-card h2 {
      margin:6px 0 8px;
      font-size:26px;
      letter-spacing:-.03em;
    }

    .onboarding-card p {
      margin:0 0 12px;
      color:#475569;
      font-size:15px;
      line-height:1.4;
    }

    .onboarding-card ul {
      margin:0 0 12px 20px;
      padding:0;
      color:#475569;
      font-size:15px;
      line-height:1.45;
    }

    .onboarding-dots {
      display:flex;
      justify-content:center;
      gap:6px;
      margin:16px 0 14px;
    }

    .onboarding-dot {
      width:8px;
      height:8px;
      border-radius:999px;
      background:#cbd5e1;
    }

    .onboarding-dot.active {
      width:22px;
      background:var(--blue);
    }

    .onboarding-actions {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      margin-top:10px;
    }

    .onboarding-actions.single {
      grid-template-columns:1fr;
    }

    .secondary {
      background:#ffffff;
      color:var(--ink);
      border-color:#cbd5e1;
    }

    .mini-guide {
      background:#f8fafc;
      border:1px solid #e2e8f0;
      border-radius:16px;
      padding:12px;
      margin-top:10px;
      font-size:14px;
      color:#475569;
      line-height:1.4;
    }

    @media (max-width:390px) {
      .help-button {
        width:34px;
        height:34px;
        min-height:34px;
        font-size:18px;
      }

      .onboarding-card {
        padding:16px;
        border-radius:20px;
      }

      .onboarding-card h2 {
        font-size:23px;
      }

      .onboarding-card p,
      .onboarding-card ul {
        font-size:14px;
      }
    }


    .pause-overlay {
      position:absolute;
      inset:0;
      display:flex;
      justify-content:center;
      align-items:center;
      background:rgba(255,255,255,.8);
      backdrop-filter:blur(6px);
      z-index:20;
    }

    .pause-overlay.hidden {
      display:none;
    }

    .pause-card {
      width:min(280px,82%);
      background:#fff;
      border:1px solid #e5e7eb;
      border-radius:20px;
      box-shadow:0 14px 38px rgba(15,23,42,.18);
      padding:18px;
      text-align:center;
    }

    .pause-card h2 {
      margin:0 0 6px;
      font-size:24px;
    }

    .pause-card p {
      margin:0 0 14px;
      color:var(--muted);
      font-size:14px;
    }

    @media (min-width:700px) {
      body {
        padding:
          max(12px, env(safe-area-inset-top))
          max(12px, env(safe-area-inset-right))
          max(12px, env(safe-area-inset-bottom))
          max(12px, env(safe-area-inset-left));
      }

      .app {
        border-radius:28px;
        padding:16px;
        gap:12px;
        box-shadow:0 10px 30px rgba(15,23,42,.12);
      }

      .topbar {
        min-height:42px;
        gap:10px;
      }

      .stat {
        min-height:42px;
        font-size:15px;
      }

      .game {
        grid-template-columns:minmax(0,1fr) minmax(270px,340px);
        grid-template-rows:1fr;
        align-items:center;
        gap:18px;
      }

      .board-zone {
        gap:10px;
        justify-content:center;
      }

      .game-area {
        width:var(--board-size, min(100%, 720px));
        height:var(--board-size, auto);
        max-width:100%;
      }

      .message {
        max-width:720px;
        min-height:38px;
        font-size:14px;
      }

      .controls {
        align-self:center;
        gap:10px;
      }

      .numbers {
        grid-template-columns:repeat(3,1fr);
        gap:8px;
      }

      .num {
        aspect-ratio:1/1;
        min-height:68px;
        font-size:28px;
      }

      button, select {
        min-height:50px;
        font-size:17px;
        border-radius:14px;
      }

      .cell {
        font-size:clamp(26px,4vw,46px);
      }
    }

    @media (min-width:700px) and (orientation:portrait) {
      .game {
        grid-template-columns:1fr;
        grid-template-rows:minmax(0,1fr) auto;
        gap:10px;
      }

      .game-area {
        width:var(--board-size, min(100%, 680px));
        height:var(--board-size, auto);
      }

      .controls {
        width:min(760px,100%);
        margin:0 auto;
      }

      .numbers {
        grid-template-columns:repeat(9,1fr);
        gap:6px;
      }

      .num {
        aspect-ratio:auto;
        min-height:52px;
        font-size:24px;
      }
    }

    @media (max-width:390px) {
      .app {
        padding:5px;
        gap:4px;
        border-radius:14px;
      }

      .topbar {
        gap:4px;
      }

      .stat {
        min-height:28px;
        font-size:11px;
      }

      .message {
        min-height:26px;
        padding:5px 7px;
        font-size:11px;
      }

      .controls {
        gap:4px;
      }

      .numbers {
        gap:3px;
      }

      .num,
      button,
      select {
        min-height:35px;
        font-size:13px;
        border-radius:10px;
      }

      .num {
        font-size:16px;
      }

      .cell {
        font-size:clamp(17px,6.3vw,30px);
      }
    }

    @media (max-height:520px) and (orientation:landscape) {
      .game {
        grid-template-columns:minmax(0,1fr) 250px;
        grid-template-rows:1fr;
        gap:8px;
      }

      .message {
        display:none;
      }

      .controls {
        gap:5px;
      }

      .numbers {
        grid-template-columns:repeat(3,1fr);
        gap:4px;
      }

      .num,
      button,
      select {
        min-height:34px;
        font-size:14px;
      }

      .num {
        font-size:17px;
      }
    }

    @media (display-mode:standalone) {
      body {
        background:var(--panel);
      }

      .app {
        box-shadow:none;
        border-radius:0;
      }
    }
  </style>
</head>

<body>

  <button id="helpBtn" class="help-button" aria-label="Open help">?</button>

  <div id="onboardingOverlay" class="onboarding-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="onboardingTitle">
    <div class="onboarding-card">
      <div class="onboarding-top">
        <div id="onboardingStepLabel" class="onboarding-label">Step 1 of 6</div>
        <button id="onboardingClose" class="onboarding-close secondary" aria-label="Close onboarding">×</button>
      </div>

      <div id="onboardingContent"></div>
      <div id="onboardingDots" class="onboarding-dots"></div>

      <div id="onboardingActions" class="onboarding-actions">
        <button id="onboardingBack" class="secondary">Back</button>
        <button id="onboardingNext" class="primary">Next</button>
      </div>
    </div>
  </div>

  <main class="app">
    <section class="topbar">
      <div class="stat">Time:<strong id="timer">00:00</strong></div>
      <div class="stat">Mistakes:<strong id="mistakes">0</strong></div>
      <div class="stat">Level:<strong id="difficultyLabel">Medium</strong></div>
    </section>

    <section class="game">
      <section class="board-zone">
        <div class="game-area">
          <div id="board" class="board"></div>
          <div id="pauseOverlay" class="pause-overlay hidden">
            <div class="pause-card">
              <h2>Paused</h2>
              <p>The timer stopped while you were away.</p>
              <button id="resumeGame" class="primary">Resume</button>
            </div>
          </div>
        </div>
        <div id="message" class="message">Select a square, then enter a number.</div>
      </section>

      <section class="controls">
        <div class="game-row">
          <select id="difficulty">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
            <option value="expert">Expert</option>
          </select>
          <button id="newGame" class="primary">New game</button>
        </div>

        <div class="numbers" id="numbers"></div>

        <div>
          <div class="action-row">
            <button id="noteMode" class="toggle">Notes off</button>
            <button id="erase" class="danger">Erase</button>
          </div>
          <div style="height:5px"></div>
          <div class="action-row">
            <button id="autoNotes">Auto notes</button>
            <button id="singleHint">Single hint</button>
          </div>
          <div style="height:5px"></div>
          <div class="action-row">
            <button id="hint">Hint</button>
            <button id="check">Check</button>
          </div>
          <div style="height:5px"></div>
          <button id="solve">Solve puzzle</button>
        </div>
      </section>
    </section>
  </main>

  <script>
    const boardEl = document.getElementById('board');
    const numbersEl = document.getElementById('numbers');
    const timerEl = document.getElementById('timer');
    const mistakesEl = document.getElementById('mistakes');
    const messageEl = document.getElementById('message');
    const difficultyEl = document.getElementById('difficulty');
    const difficultyLabelEl = document.getElementById('difficultyLabel');
    const noteModeBtn = document.getElementById('noteMode');
    const pauseOverlayEl = document.getElementById('pauseOverlay');
    const resumeGameBtn = document.getElementById('resumeGame');

    const removalsByDifficulty = {
      easy: 36,
      medium: 46,
      hard: 52,
      expert: 58
    };

    let solution = [];
    let puzzle = [];
    let player = [];
    let fixed = [];
    let notes = Array.from({ length: 81 }, () => new Set());
    let selected = null;
    let highlightedNumber = null;
    let noteMode = false;
    let mistakes = 0;
    let startTime = Date.now();
    let timerInterval = null;
    let gameOver = false;
    let paused = false;
    let elapsedBeforePause = 0;

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function index(row, col) { return row * 9 + col; }
    function rowOf(i) { return Math.floor(i / 9); }
    function colOf(i) { return i % 9; }
    function boxOf(i) { return Math.floor(rowOf(i) / 3) * 3 + Math.floor(colOf(i) / 3); }

    function isSafe(grid, row, col, value) {
      for (let c = 0; c < 9; c++) if (grid[index(row, c)] === value) return false;
      for (let r = 0; r < 9; r++) if (grid[index(r, col)] === value) return false;

      const br = Math.floor(row / 3) * 3;
      const bc = Math.floor(col / 3) * 3;

      for (let r = br; r < br + 3; r++) {
        for (let c = bc; c < bc + 3; c++) {
          if (grid[index(r, c)] === value) return false;
        }
      }
      return true;
    }

    function solveGrid(grid) {
      const empty = grid.findIndex(v => v === 0);
      if (empty === -1) return true;

      for (const n of shuffle([1,2,3,4,5,6,7,8,9])) {
        if (isSafe(grid, rowOf(empty), colOf(empty), n)) {
          grid[empty] = n;
          if (solveGrid(grid)) return true;
          grid[empty] = 0;
        }
      }
      return false;
    }

    function countSolutions(grid, limit = 2) {
      let count = 0;

      function backtrack() {
        if (count >= limit) return;

        let empty = -1;
        let bestCandidates = null;

        for (let i = 0; i < 81; i++) {
          if (grid[i] !== 0) continue;

          const candidates = [];
          for (let n = 1; n <= 9; n++) {
            if (isSafe(grid, rowOf(i), colOf(i), n)) candidates.push(n);
          }

          if (candidates.length === 0) return;

          if (!bestCandidates || candidates.length < bestCandidates.length) {
            bestCandidates = candidates;
            empty = i;
          }
        }

        if (empty === -1) {
          count++;
          return;
        }

        for (const n of bestCandidates) {
          grid[empty] = n;
          backtrack();
          grid[empty] = 0;
          if (count >= limit) return;
        }
      }

      backtrack();
      return count;
    }

    function generateSolvedGrid() {
      const grid = Array(81).fill(0);
      solveGrid(grid);
      return grid;
    }

    function generatePuzzle(difficulty) {
      const full = generateSolvedGrid();
      const puz = [...full];
      const cells = shuffle([...Array(81).keys()]);
      let removed = 0;
      const target = removalsByDifficulty[difficulty];

      for (const cell of cells) {
        if (removed >= target) break;

        const backup = puz[cell];
        puz[cell] = 0;

        if (countSolutions([...puz], 2) === 1) {
          removed++;
        } else {
          puz[cell] = backup;
        }
      }

      return { full, puz };
    }


    function getCandidates(cellIndex) {
      if (player[cellIndex]) return [];
      const used = new Set();

      for (let c = 0; c < 9; c++) {
        const v = player[index(rowOf(cellIndex), c)];
        if (v) used.add(v);
      }

      for (let r = 0; r < 9; r++) {
        const v = player[index(r, colOf(cellIndex))];
        if (v) used.add(v);
      }

      const br = Math.floor(rowOf(cellIndex) / 3) * 3;
      const bc = Math.floor(colOf(cellIndex) / 3) * 3;

      for (let r = br; r < br + 3; r++) {
        for (let c = bc; c < bc + 3; c++) {
          const v = player[index(r, c)];
          if (v) used.add(v);
        }
      }

      const candidates = [];
      for (let n = 1; n <= 9; n++) {
        if (!used.has(n)) candidates.push(n);
      }
      return candidates;
    }

    function hasDuplicateConflict(cellIndex) {
      const value = player[cellIndex];
      if (!value) return false;

      for (let c = 0; c < 9; c++) {
        const i = index(rowOf(cellIndex), c);
        if (i !== cellIndex && player[i] === value) return true;
      }

      for (let r = 0; r < 9; r++) {
        const i = index(r, colOf(cellIndex));
        if (i !== cellIndex && player[i] === value) return true;
      }

      const br = Math.floor(rowOf(cellIndex) / 3) * 3;
      const bc = Math.floor(colOf(cellIndex) / 3) * 3;

      for (let r = br; r < br + 3; r++) {
        for (let c = bc; c < bc + 3; c++) {
          const i = index(r, c);
          if (i !== cellIndex && player[i] === value) return true;
        }
      }

      return false;
    }

    function fillAutoNotes() {
      if (gameOver || paused) return;

      for (let i = 0; i < 81; i++) {
        if (!fixed[i] && !player[i]) {
          notes[i] = new Set(getCandidates(i));
        }
      }

      setMessage('Auto notes added based on current board.');
      renderBoard();
    }

    function singleCandidateHint() {
      if (gameOver || paused) return;

      for (let i = 0; i < 81; i++) {
        if (!fixed[i] && !player[i]) {
          const candidates = getCandidates(i);
          if (candidates.length === 1) {
            selected = i;
            highlightedNumber = candidates[0];
            notes[i] = new Set(candidates);
            setMessage(`Single candidate found: ${candidates[0]} at row ${rowOf(i) + 1}, column ${colOf(i) + 1}.`);
            renderBoard();
            return;
          }
        }
      }

      setMessage('No single-candidate cell found right now.');
    }

    function renderBoard() {
      boardEl.innerHTML = '';

      for (let i = 0; i < 81; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';

        if (fixed[i]) cell.classList.add('fixed');

        if (selected !== null && i !== selected) {
          if (
            rowOf(i) === rowOf(selected) ||
            colOf(i) === colOf(selected) ||
            boxOf(i) === boxOf(selected)
          ) {
            cell.classList.add('peer');
          }
        }

        if (highlightedNumber && player[i] === highlightedNumber) cell.classList.add('same');
        if (selected === i) cell.classList.add('selected');
        if (hasDuplicateConflict(i)) cell.classList.add('conflict');
        if (player[i] && player[i] !== solution[i]) cell.classList.add('error');
        if (!fixed[i] && player[i] && player[i] === solution[i]) cell.classList.add('correct');

        if (player[i]) {
          cell.textContent = player[i];
        } else if (notes[i].size) {
          const notesGrid = document.createElement('div');
          notesGrid.className = 'notes';

          for (let n = 1; n <= 9; n++) {
            const span = document.createElement('span');
            span.textContent = notes[i].has(n) ? n : '';
            notesGrid.appendChild(span);
          }

          cell.appendChild(notesGrid);
        }

        cell.addEventListener('click', () => selectCell(i));
        boardEl.appendChild(cell);
      }
    }

    function renderNumbers() {
      numbersEl.innerHTML = '';

      for (let n = 1; n <= 9; n++) {
        const btn = document.createElement('button');
        btn.className = 'num';
        btn.textContent = n;
        btn.addEventListener('click', () => enterNumber(n));
        numbersEl.appendChild(btn);
      }
    }

    function selectCell(i) {
      if (gameOver || paused) return;

      selected = i;
      highlightedNumber = player[i] || null;

      if (navigator.vibrate) navigator.vibrate(8);

      renderBoard();
    }

    function enterNumber(n) {
      if (selected === null || fixed[selected] || gameOver || paused) return;

      if (noteMode) {
        if (player[selected]) return;

        if (notes[selected].has(n)) notes[selected].delete(n);
        else notes[selected].add(n);

        setMessage(`Note ${n} ${notes[selected].has(n) ? 'added' : 'removed'}.`);
      } else {
        player[selected] = n;
        highlightedNumber = n;
        notes[selected].clear();
        removeNoteFromPeers(selected, n);

        if (n !== solution[selected]) {
          mistakes++;
          mistakesEl.textContent = mistakes;
          setMessage('That number does not fit there.');
        } else {
          setMessage('Good move.');
        }

        checkWin();
      }

      renderBoard();
    }

    function removeNoteFromPeers(cellIndex, n) {
      for (let i = 0; i < 81; i++) {
        if (
          rowOf(i) === rowOf(cellIndex) ||
          colOf(i) === colOf(cellIndex) ||
          boxOf(i) === boxOf(cellIndex)
        ) {
          notes[i].delete(n);
        }
      }
    }

    function eraseCell() {
      if (selected === null || fixed[selected] || gameOver || paused) return;

      player[selected] = 0;
      highlightedNumber = null;
      notes[selected].clear();

      setMessage('Cell cleared.');
      renderBoard();
    }

    function setMessage(text, win = false) {
      messageEl.textContent = text;
      messageEl.classList.toggle('win', win);
    }

    function checkBoard() {
      if (gameOver || paused) return;

      let wrong = 0;
      let empty = 0;

      for (let i = 0; i < 81; i++) {
        if (!player[i]) empty++;
        else if (player[i] !== solution[i]) wrong++;
      }

      if (wrong === 0 && empty === 0) {
        winGame();
      } else if (wrong === 0) {
        setMessage(`No mistakes found. ${empty} cells left.`);
      } else {
        setMessage(`${wrong} incorrect cell${wrong > 1 ? 's' : ''} found.`);
      }

      renderBoard();
    }

    function giveHint() {
      if (gameOver || paused) return;

      const candidates = [];

      for (let i = 0; i < 81; i++) {
        if (!fixed[i] && player[i] !== solution[i]) candidates.push(i);
      }

      if (!candidates.length) return checkWin();

      const cell = candidates[Math.floor(Math.random() * candidates.length)];

      selected = cell;
      player[cell] = solution[cell];
      highlightedNumber = solution[cell];
      notes[cell].clear();
      removeNoteFromPeers(cell, solution[cell]);

      setMessage(`Hint added at row ${rowOf(cell) + 1}, column ${colOf(cell) + 1}.`);
      checkWin();
      renderBoard();
    }

    function solvePuzzle() {
      if (paused) return;

      player = [...solution];
      notes = Array.from({ length: 81 }, () => new Set());
      highlightedNumber = null;
      gameOver = true;

      stopTimer();
      setMessage('Puzzle solved.', true);
      renderBoard();
    }

    function checkWin() {
      for (let i = 0; i < 81; i++) {
        if (player[i] !== solution[i]) return false;
      }

      winGame();
      return true;
    }

    function winGame() {
      gameOver = true;
      stopTimer();

      setMessage(
        `Congratulations. You solved it in ${timerEl.textContent} with ${mistakes} mistake${mistakes === 1 ? '' : 's'}.`,
        true
      );
    }

    function toggleNotes() {
      if (gameOver || paused) return;

      noteMode = !noteMode;
      noteModeBtn.classList.toggle('active', noteMode);
      noteModeBtn.textContent = noteMode ? 'Notes on' : 'Notes off';
    }

    function formatTime(ms) {
      const total = Math.floor(ms / 1000);
      const m = Math.floor(total / 60).toString().padStart(2, '0');
      const s = (total % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function startTimer() {
      stopTimer();

      startTime = Date.now();
      elapsedBeforePause = 0;
      paused = false;

      pauseOverlayEl.classList.add('hidden');
      timerEl.textContent = '00:00';

      timerInterval = setInterval(() => {
        if (!paused) {
          timerEl.textContent = formatTime(Date.now() - startTime + elapsedBeforePause);
        }
      }, 1000);
    }

    function stopTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = null;
    }

    function pauseGame() {
      if (gameOver || paused) return;

      paused = true;
      elapsedBeforePause += Date.now() - startTime;
      pauseOverlayEl.classList.remove('hidden');

      setMessage('Game paused. Tap Resume to continue.');
    }

    function resumeGame() {
      if (gameOver || !paused) return;

      paused = false;
      startTime = Date.now();
      pauseOverlayEl.classList.add('hidden');

      setMessage('Game resumed.');
    }

    function newGame() {
      const difficulty = difficultyEl.value;

      difficultyLabelEl.textContent = difficulty.charAt(0).toUpperCase() + difficulty.slice(1);
      setMessage('Generating puzzle...');

      setTimeout(() => {
        const generated = generatePuzzle(difficulty);

        solution = generated.full;
        puzzle = generated.puz;
        player = [...puzzle];
        fixed = puzzle.map(v => v !== 0);
        notes = Array.from({ length: 81 }, () => new Set());
        selected = null;
        highlightedNumber = null;
        noteMode = false;
        mistakes = 0;
        gameOver = false;

        mistakesEl.textContent = '0';
        noteModeBtn.classList.remove('active');
        noteModeBtn.textContent = 'Notes off';

        setMessage('Select a square, then enter a number.');
        startTimer();
        renderBoard();
        setTimeout(updateBoardSize, 40);
      }, 20);
    }

    document.getElementById('newGame').addEventListener('click', newGame);
    document.getElementById('erase').addEventListener('click', eraseCell);
    document.getElementById('check').addEventListener('click', checkBoard);
    document.getElementById('autoNotes').addEventListener('click', fillAutoNotes);
    document.getElementById('singleHint').addEventListener('click', singleCandidateHint);
    document.getElementById('hint').addEventListener('click', giveHint);
    document.getElementById('solve').addEventListener('click', solvePuzzle);
    noteModeBtn.addEventListener('click', toggleNotes);
    resumeGameBtn.addEventListener('click', resumeGame);

    document.addEventListener('touchmove', e => {
      if (e.scale !== 1) e.preventDefault();
    }, { passive: false });

    document.addEventListener('gesturestart', e => e.preventDefault());

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) pauseGame();
    });

    document.addEventListener('keydown', e => {
      if (paused) return;

      if (e.key >= '1' && e.key <= '9') enterNumber(Number(e.key));
      if (e.key === '0' || e.key === 'Backspace' || e.key === 'Delete') eraseCell();
      if (e.key.toLowerCase() === 'n') toggleNotes();

      if (selected !== null) {
        let next = selected;

        if (e.key === 'ArrowUp') next = Math.max(0, selected - 9);
        if (e.key === 'ArrowDown') next = Math.min(80, selected + 9);
        if (e.key === 'ArrowLeft') next = selected % 9 === 0 ? selected : selected - 1;
        if (e.key === 'ArrowRight') next = selected % 9 === 8 ? selected : selected + 1;

        if (next !== selected) {
          e.preventDefault();
          selectCell(next);
        }
      }
    });


    const helpBtn = document.getElementById('helpBtn');
    const onboardingOverlay = document.getElementById('onboardingOverlay');
    const onboardingContent = document.getElementById('onboardingContent');
    const onboardingDots = document.getElementById('onboardingDots');
    const onboardingStepLabel = document.getElementById('onboardingStepLabel');
    const onboardingBack = document.getElementById('onboardingBack');
    const onboardingNext = document.getElementById('onboardingNext');
    const onboardingClose = document.getElementById('onboardingClose');

    const onboardingSteps = [
      {
        title: 'Welcome to Sudoku',
        body: `
          <p><strong>Goal:</strong> fill every row, column, and 3×3 box with the numbers 1 to 9.</p>
          <p>Each number can appear only once in each row, column, and box.</p>
          <div class="mini-guide">Tip: start by looking for rows, columns, or boxes that already have many numbers.</div>
        `
      },
      {
        title: 'Selecting and entering numbers',
        body: `
          <p>Tap a square on the board, then tap a number from 1 to 9.</p>
          <p>When you select a number, all matching visible numbers are highlighted so you can scan the board faster.</p>
          <ul>
            <li><strong>Blue outline:</strong> selected square</li>
            <li><strong>Yellow:</strong> same number visible elsewhere</li>
            <li><strong>Light shading:</strong> same row, column, or box</li>
          </ul>
        `
      },
      {
        title: 'Notes mode',
        body: `
          <p><strong>Notes ON</strong> is pencil mode. It lets you add possible candidate numbers inside a square.</p>
          <p><strong>Notes OFF</strong> is answer mode. Numbers entered become your final answer.</p>
          <div class="mini-guide">Use notes when you are unsure. Turn notes off when you are ready to commit.</div>
        `
      },
      {
        title: 'Auto notes and single hints',
        body: `
          <p><strong>Auto notes</strong> fills possible candidates based on the current board.</p>
          <p><strong>Single hint</strong> looks for a square that has only one possible candidate.</p>
          <p>These are learning tools. They help newer players understand how Sudoku logic works.</p>
        `
      },
      {
        title: 'Mistakes, conflicts, and checking',
        body: `
          <p>If a number does not match the solution, the mistake counter increases.</p>
          <p>If the same number conflicts in a row, column, or box, the app highlights the conflict.</p>
          <ul>
            <li><strong>Check:</strong> scans the board</li>
            <li><strong>Hint:</strong> reveals one correct answer</li>
            <li><strong>Erase:</strong> clears the selected square</li>
          </ul>
        `
      },
      {
        title: 'Best mobile experience',
        body: `
          <p>For the best full-screen feel on iPhone or iPad:</p>
          <ul>
            <li>Open the game in Safari</li>
            <li>Tap the Share button</li>
            <li>Tap <strong>Add to Home Screen</strong></li>
            <li>Launch Sudoku from the new icon</li>
          </ul>
          <div class="mini-guide">You can reopen this guide anytime with the <strong>?</strong> button.</div>
        `
      }
    ];

    let onboardingIndex = 0;

    function renderOnboarding() {
      const step = onboardingSteps[onboardingIndex];

      onboardingStepLabel.textContent = `Step ${onboardingIndex + 1} of ${onboardingSteps.length}`;
      onboardingContent.innerHTML = `<h2 id="onboardingTitle">${step.title}</h2>${step.body}`;

      onboardingDots.innerHTML = '';
      onboardingSteps.forEach((_, i) => {
        const dot = document.createElement('div');
        dot.className = 'onboarding-dot' + (i === onboardingIndex ? ' active' : '');
        onboardingDots.appendChild(dot);
      });

      onboardingBack.disabled = onboardingIndex === 0;
      onboardingBack.style.opacity = onboardingIndex === 0 ? '.45' : '1';
      onboardingNext.textContent = onboardingIndex === onboardingSteps.length - 1 ? 'Start playing' : 'Next';

      const actions = document.getElementById('onboardingActions');
      actions.classList.toggle('single', onboardingIndex === 0);
      onboardingBack.style.display = onboardingIndex === 0 ? 'none' : 'block';
    }

    function openOnboarding(startAt = 0) {
      onboardingIndex = startAt;
      renderOnboarding();
      onboardingOverlay.classList.remove('hidden');
    }

    function closeOnboarding() {
      onboardingOverlay.classList.add('hidden');
      localStorage.setItem('sudokuOnboardingSeen', 'true');
    }

    helpBtn.addEventListener('click', () => openOnboarding(0));
    onboardingClose.addEventListener('click', closeOnboarding);

    onboardingBack.addEventListener('click', () => {
      if (onboardingIndex > 0) {
        onboardingIndex--;
        renderOnboarding();
      }
    });

    onboardingNext.addEventListener('click', () => {
      if (onboardingIndex < onboardingSteps.length - 1) {
        onboardingIndex++;
        renderOnboarding();
      } else {
        closeOnboarding();
      }
    });

    onboardingOverlay.addEventListener('click', e => {
      if (e.target === onboardingOverlay) closeOnboarding();
    });

    if (!localStorage.getItem('sudokuOnboardingSeen')) {
      setTimeout(() => openOnboarding(0), 350);
    }



    function updateBoardSize() {
      const app = document.querySelector('.app');
      const topbar = document.querySelector('.topbar');
      const game = document.querySelector('.game');
      const boardZone = document.querySelector('.board-zone');
      const controls = document.querySelector('.controls');
      const message = document.querySelector('.message');

      if (!app || !topbar || !game || !boardZone || !controls || !message) return;

      const vv = window.visualViewport;
      const viewportHeight = vv ? vv.height : window.innerHeight;
      const viewportWidth = vv ? vv.width : window.innerWidth;

      const appStyles = getComputedStyle(app);
      const appPadY = parseFloat(appStyles.paddingTop) + parseFloat(appStyles.paddingBottom);
      const appPadX = parseFloat(appStyles.paddingLeft) + parseFloat(appStyles.paddingRight);
      const appGap = parseFloat(appStyles.rowGap || appStyles.gap || 0);

      const gameStyles = getComputedStyle(game);
      const columns = gameStyles.gridTemplateColumns.split(' ').filter(Boolean);
      const isSideBySide = viewportWidth >= 700 && columns.length > 1 && window.matchMedia('(orientation: landscape)').matches;

      const topbarHeight = topbar.getBoundingClientRect().height;
      const messageHeight = message.getBoundingClientRect().height;
      const controlsRect = controls.getBoundingClientRect();
      const boardZoneRect = boardZone.getBoundingClientRect();

      let availableHeight;
      let availableWidth;

      if (isSideBySide) {
        availableHeight = viewportHeight - appPadY - topbarHeight - messageHeight - appGap - 34;
        availableWidth = viewportWidth - appPadX - controlsRect.width - 44;
      } else {
        availableHeight = viewportHeight - appPadY - topbarHeight - controlsRect.height - messageHeight - appGap - 42;
        availableWidth = boardZoneRect.width - 6;
      }

      const maxSize = viewportWidth >= 700 ? 720 : 520;
      let size = Math.floor(Math.min(availableHeight, availableWidth, maxSize));

      if (viewportWidth < 700) {
        size = Math.floor(Math.min(size, viewportWidth - appPadX - 10));
      }

      size = Math.max(240, size);
      document.documentElement.style.setProperty('--board-size', size + 'px');
    }

    window.addEventListener('resize', updateBoardSize);
    window.addEventListener('orientationchange', () => setTimeout(updateBoardSize, 250));

    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', updateBoardSize);
      window.visualViewport.addEventListener('scroll', updateBoardSize);
    }


    renderNumbers();
    newGame();
    setTimeout(updateBoardSize, 80);
    setTimeout(updateBoardSize, 450);
  </script>
</body>
</html>
