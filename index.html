<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sudoku</title>
<style>
body{
  margin:0;
  font-family:Arial;
  background:#f4f6f8;
  height:100%;
}

.app{
  min-height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.topbar{
  display:flex;
  gap:6px;
  width:100%;
  justify-content:space-between;
  padding:6px;
}

.stat{
  flex:1;
  background:#eee;
  border-radius:20px;
  padding:6px;
  text-align:center;
  font-size:12px;
}

.game{
  display:flex;
  flex-direction:column;
  align-items:center;
  width:100%;
}

.game-area{
  width:min(100%,520px);
  max-height:60vh;
}

.board{
  width:100%;
  aspect-ratio:1;
  display:grid;
  grid-template-columns:repeat(9,1fr);
  border:2px solid black;
}

.cell{
  border:1px solid #ccc;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
}

.controls{
  width:min(520px,100%);
  padding:10px;
}

.numbers{
  display:grid;
  grid-template-columns:repeat(9,1fr);
  gap:4px;
}

button{
  padding:10px;
  margin-top:5px;
  width:100%;
}
</style>
</head>
<body>

<div class="app">

<div class="topbar">
<div class="stat">Time</div>
<div class="stat">Mistakes</div>
<div class="stat">Medium</div>
</div>

<div class="game">
<div class="game-area">
<div class="board" id="board"></div>
</div>

<div class="controls">
<div class="numbers" id="numbers"></div>
<button>New Game</button>
</div>
</div>

</div>

<script>
const board=document.getElementById("board");
for(let i=0;i<81;i++){
 let c=document.createElement("div");
 c.className="cell";
 board.appendChild(c);
}

const numbers=document.getElementById("numbers");
for(let i=1;i<=9;i++){
 let b=document.createElement("button");
 b.textContent=i;
 numbers.appendChild(b);
}
</script>

</body>
</html>
